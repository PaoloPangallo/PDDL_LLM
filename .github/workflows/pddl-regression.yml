name: PDDL project safety and regression checks

on:
  pull_request:
  push:
    branches:
      - fix/preserve-pddl-project-reliability

jobs:
  stdlib-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python syntax
        run: python -m compileall -q PROGETTOIAPDDL
      - name: Verify Bash syntax
        run: bash -n PROGETTOIAPDDL/planner/run-planner.sh
      - name: Validate browser JavaScript syntax
        run: node --check PROGETTOIAPDDL/static/js/pipeline.js
      - name: Run isolated regression suite
        run: python -m unittest discover -s PROGETTOIAPDDL/tests -v

  graph-import-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install declared Python dependencies
        run: python -m pip install -r PROGETTOIAPDDL/requirements.txt
      - name: Build LangGraph without Ollama or planner execution
        working-directory: PROGETTOIAPDDL
        run: |
          python - <<'PY'
          from graphs.pddl_pipeline_graph import build_pipeline
          from routes.app_factory import QuestMasterApp
          from config import TestConfig
          graph = build_pipeline()
          app = QuestMasterApp.create(TestConfig)
          assert any(rule.rule == "/" for rule in app.url_map.iter_rules())
          assert graph is not None
          print("LangGraph and Flask imports/registration succeed.")
          PY
